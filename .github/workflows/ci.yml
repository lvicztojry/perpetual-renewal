name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Secret scan, QA, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secrets:check

      - name: Docs consistency
        run: npm run docs:check

      - name: Next typegen
        run: npm run next:typegen

      - name: Git boundary
        run: npm run git:boundary

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: QA samples
        run: npm run qa:samples

      - name: Prompt QA
        run: npm run qa:prompt

      - name: Structured import QA
        run: npm run qa:imports

      - name: Config vault QA
        run: npm run qa:vault

      - name: Logging sanitize QA
        run: npm run qa:logging

      - name: PWA check
        run: npm run pwa:check

      - name: Environment readiness
        run: npm run env:readiness

      - name: Prisma validate
        run: npm run prisma:validate

      - name: DB smoke
        run: npm run db:smoke

      - name: Smoke tests
        run: npm run smoke

      - name: Build
        run: npm run build
